spring.application.name=fitness

# Server configuration (Render dynamically sets PORT)
server.port=${PORT:8080}

# Database configuration
spring.datasource.url=${DB_URL:${DATABASE_URL:jdbc:mysql://localhost:3306/fitness?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${DB_USERNAME:${DB_USER:${USER:root}}}
spring.datasource.password=${DB_PASSWORD:${DB_PASS:${PASS:root}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate configuration
spring.jpa.database-platform=${DIALECT:org.hibernate.dialect.MySQLDialect}
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# JWT Authentication configuration
jwt.secret=${JWT_SECRET:nbag7ya9uwesjjjjj=skdjosidusd89y87whjsdkbsdjhbds78e7e77e=ekeke}
jwt.expiration-ms=${JWT_EXPIRATION_MS:172800000}

# Swagger / OpenAPI documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method